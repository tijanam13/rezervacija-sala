# Naziv aplikacije
spring.application.name=rezervacija-sala

# Baza podataka
spring.datasource.url=jdbc:mysql://localhost:3307/rezervacija_sala?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Port aplikacije
server.port=8080

# Ogranicenje velicine HTTP zahteva
server.tomcat.max-http-form-post-size=2MB
app.security.max-request-size-bytes=2097152

# JWT autentifikacija 
app.jwt.secret=test-jwt-secret-samo-za-testiranje
app.jwt.expiration-ms=86400000

# Slanje mejlova 
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test-lozinka
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=Rezervacija sala <${spring.mail.username}>

# Frontend aplikacija
app.frontend.url=http://localhost:3000

# Inicijalni administratorski nalog 
app.admin.email=test-admin@example.com
app.admin.lozinka=test-lozinka