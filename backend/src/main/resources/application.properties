# Naziv aplikacije
spring.application.name=rezervacija-sala

# Baza podataka
spring.datasource.url=jdbc:mysql://localhost:3307/rezervacija_sala?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Port aplikacije
server.port=8080

# Kodiranje log ispisa 
logging.charset.console=UTF-8

# Ogranicenje velicine HTTP zahteva
server.tomcat.max-http-form-post-size=2MB
app.security.max-request-size-bytes=2097152

# Zastita od brute-force napada 
app.security.max-neuspesnih-pokusaja=5
app.security.trajanje-zakljucavanja-minuti=15

# JWT autentifikacija
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Slanje mejlova
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=Rezervacija sala <${spring.mail.username}>

# Frontend aplikacija
app.frontend.url=http://localhost:5173

# Inicijalni administratorski nalog
app.admin.email=${ADMIN_EMAIL:admin@fon.bg.ac.rs}
app.admin.lozinka=${ADMIN_LOZINKA:lozinka123}