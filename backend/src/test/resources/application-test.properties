# Naziv aplikacije
spring.application.name=rezervacija-sala

# Baza podataka - H2 
spring.datasource.url=jdbc:h2:mem:test-baza;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Port aplikacije
server.port=8080

# Kodiranje log ispisa
logging.charset.console=UTF-8

# Ogranicenje velicine HTTP zahteva
server.tomcat.max-http-form-post-size=2MB
app.security.max-request-size-bytes=2097152

# Zastita od brute-force napada
app.security.max-neuspesnih-pokusaja=5
app.security.trajanje-zakljucavanja-minuti=15

# JWT autentifikacija 
app.jwt.secret=test-jwt-secret-samo-za-testiranje
app.jwt.expiration-ms=86400000

# Slanje mejlova 
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test-lozinka
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=Rezervacija sala <${spring.mail.username}>

# Frontend aplikacija
app.frontend.url=http://localhost:5173

# Inicijalni administratorski nalog
app.admin.email=test-admin@example.com
app.admin.lozinka=test-lozinka